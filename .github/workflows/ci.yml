name: CI

on:
  push:
    branches: [master, main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RAYFORCE_SRC: ${{ github.workspace }}/rayforce-core
  RAYFORCE_Q_SRC: ${{ github.workspace }}/rayforce-q

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # Both legs must report: a debug-flavour failure is a real memory bug and
      # cancelling the release leg over it (or vice versa) hides half the story.
      fail-fast: false
      matrix:
        # Which flavour of librayforce.a to link. `debug` compiles the core with
        # -DDEBUG, arming the engine's stale retain/release detector (DFD) — see
        # rayforce-sys/build.rs. ASan cannot see into the engine's mmap-backed
        # pool allocator, so DFD is the only tool for this bug class.
        core: [release, debug]
    env:
      # Job-scoped, not step-scoped: the core binary is built in its own step and
      # must use the same flavour, or build.rs would see a flavour flip at
      # `cargo test` time and `make clean` the binary away. Empty on the release
      # leg — build.rs and the core's dfd_enabled() both read empty as off.
      RAYFORCE_CORE_DEBUG: ${{ matrix.core == 'debug' && '1' || '' }}
      RAY_DFD: ${{ matrix.core == 'debug' && '1' || '' }}
    steps:
      - name: Checkout bindings
        uses: actions/checkout@v4

      - name: Checkout RayforceDB core
        uses: actions/checkout@v4
        with:
          repository: RayforceDB/rayforce
          path: rayforce-core

      - name: Checkout rayforce-q client
        uses: actions/checkout@v4
        with:
          repository: RayforceDB/rayforce-q
          path: rayforce-q

      - name: Install toolchain deps
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev build-essential

      # The repo's .cargo/config.toml sets a macOS LIBCLANG_PATH for local dev.
      # On Linux that path is invalid, so point bindgen at the apt libclang here
      # — an env var set in the job takes precedence over the config default.
      - name: Locate libclang
        run: |
          LIB="$(find /usr/lib -name 'libclang*.so*' 2>/dev/null | head -1)"
          if [ -z "$LIB" ]; then echo "libclang not found" >&2; exit 1; fi
          echo "LIBCLANG_PATH=$(dirname "$LIB")" >> "$GITHUB_ENV"
          echo "Using LIBCLANG_PATH=$(dirname "$LIB")"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ matrix.core }}-${{ hashFiles('**/Cargo.toml') }}

      # Lints are flavour-independent; running them twice only doubles the wait.
      - name: Format check
        if: matrix.core == 'release'
        run: cargo fmt --all -- --check

      - name: Clippy
        if: matrix.core == 'release'
        run: cargo clippy --workspace --all-targets -- -D warnings

      # tests/ipc.rs spawns a real server to exercise TcpClient — the path
      # Runtime's poll teardown lives on. Without a binary it returns early and
      # reports as a pass, so that coverage was silently absent from CI.
      #
      # Ordering matters: `cargo build` runs build.rs, which does `make lib` at
      # this leg's flavour. `make release` then reuses those objects untouched
      # and only adds main.c plus the link, so the binary inherits the flavour
      # (on the debug leg it carries DFD too, checking the server side as well).
      - name: Build the core server binary
        run: |
          cargo build --workspace --tests
          make -C "$RAYFORCE_SRC" release
          echo "RAYFORCE_BINARY=$RAYFORCE_SRC/rayforce" >> "$GITHUB_ENV"
          echo "RAYFORCE_REQUIRE_SERVER=1" >> "$GITHUB_ENV"

      - name: Test
        run: cargo test --workspace
